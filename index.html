<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paie TN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Simulateur de paie</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2333; --muted:#66708a; --line:#e2e7f1;
  --navy:#1F3864; --accent:#D21034; --accent-soft:#fdeaed; --tn-red:#E70013; --good:#16794c; --good-soft:#e5f6ee; --warn:#a15c00; --warn-soft:#fff3dc; --bad:#b3261e;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151f;--card:#1a2130;--ink:#e8ecf5;--muted:#9aa5bf;--line:#2a3347;--navy:#0f1b33;--accent:#ff7b88;--accent-soft:#3b1a20;--tn-red:#E70013;--good:#5fd39b;--good-soft:#16352a;--warn:#ffc266;--warn-soft:#3a2d12;--bad:#ff8a80;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 13px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:12px;opacity:.75}
header .hwrap{display:flex;align-items:center;gap:11px}
header .flag{width:34px;height:23px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#E70013 0 34%,#fff 34% 66%,#E70013 66%)}
.card h2{display:flex;align-items:center;gap:7px}
.card h2 svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit;min-height:44px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:grid;gap:10px;margin-bottom:10px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
.row:last-child{margin-bottom:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;min-height:40px}
.seg button.on{background:var(--accent);color:#fff}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.prime{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.prime .top{display:flex;gap:8px;align-items:flex-end}
.prime .top>div{flex:1}
.del{border:0;background:transparent;color:var(--bad);font-size:22px;line-height:1;padding:8px 10px;min-height:44px;border-radius:10px}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.tag.yes{background:var(--accent-soft);color:var(--accent)}
.btn{width:100%;border:1px dashed var(--accent);color:var(--accent);background:transparent;padding:12px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;min-height:46px}
.btn.solid{border:0;background:var(--accent);color:#fff}
.btn.ghost{border:1px solid var(--line);color:var(--ink)}
.btn.danger{border:1px solid var(--bad);color:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--navy),#2c4f8f);color:#fff;border:0;border-top:3px solid var(--tn-red)}
.hero .lab{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.6px}
.hero .big{font-size:34px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px;opacity:.85}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:700;white-space:nowrap}
.kv.tot{font-weight:800}
.kv.tot:last-child b{color:var(--accent)}
.kv.tot span:first-child{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;margin-top:10px;padding:8px 10px;border-radius:10px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
details summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0;min-height:36px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px 9px;font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;color:var(--muted);text-align:left;padding:4px 4px 6px;font-weight:700}
table.t td{padding:3px 3px}
table.t input[type=text],table.t input[type=number]{padding:8px 8px;font-size:14px;min-height:38px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222c;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:9;backdrop-filter:blur(6px)}
.install svg{width:14px;height:14px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.install.note-ios{line-height:1.5;text-align:left;font-weight:600;cursor:default}
.install{display:none;background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;border:0;width:100%;font-family:inherit;font-size:14px;min-height:44px}

/* ---------- bulletin (feuille papier, toujours claire) ---------- */
.paper-wrap{width:100%;margin-bottom:12px;overflow:hidden;border-radius:6px;box-shadow:var(--shadow)}
.paper{width:720px;background:#fff;color:#000;font:11px/1.25 Arial,Helvetica,sans-serif;padding:14px 14px 16px;transform-origin:top left}
.paper *{box-sizing:border-box}
.bul-field label{margin-top:8px}

/* ---------- modèle noir et blanc ---------- */
.paper.bw{font:11px/1.35 "Segoe UI",Arial,Helvetica,sans-serif;padding:24px 26px 18px;position:relative;overflow:hidden}
.paper.bw>*:not(.wm){position:relative;z-index:1}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden}
.wm span{font-size:56px;font-weight:800;letter-spacing:8px;color:#000;opacity:.05;transform:rotate(-27deg);white-space:nowrap;text-transform:uppercase}
.bw-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #000;padding-bottom:9px}
.bw-head h1{margin:0;font-size:19px;letter-spacing:4px;font-weight:800;text-transform:uppercase}
.bw-head .soc{font-size:12px;font-weight:700;margin-top:5px}
.bw-head .adr{font-size:10px;margin-top:1px}
.bw-head .per{text-align:right;font-size:10px;line-height:1.6}
.bw-head .per b{display:block;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.bw-sub{border-top:1px solid #000;margin-top:2px;margin-bottom:14px}
.bw-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #000;margin-bottom:12px}
.bw-cols>div{padding:8px 11px}
.bw-cols>div+div{border-left:1px solid #000}
.bw-cols h3{margin:0 0 6px;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;font-weight:800;border-bottom:1px solid #000;padding-bottom:4px}
.bw-l{display:flex;gap:8px;padding:2px 0;align-items:baseline}
.bw-l b{min-width:84px;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.bw-l span{flex:1;font-weight:700}
.bw-band{display:flex;flex-wrap:wrap;gap:0 18px;border:1px solid #000;border-top:0;margin:-12px 0 14px;padding:6px 11px;font-size:10.5px}
.bw-band i{font-style:normal;text-transform:uppercase;letter-spacing:.4px}
.bw-band i b{font-weight:800}
table.bw-tab{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:0}
table.bw-tab thead th{border-top:1px solid #000;border-bottom:1px solid #000;padding:6px 5px;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;text-align:right}
table.bw-tab thead th:first-child{text-align:left}
table.bw-tab td{padding:4px 5px;text-align:right;white-space:nowrap}
table.bw-tab td:first-child{text-align:left;white-space:normal}
table.bw-tab tr.sec td{padding:10px 5px 3px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800}
table.bw-tab tr.rule td{border-bottom:1px solid #000;padding:0;height:1px}
table.bw-tab tr.tot td{font-weight:800;border-top:1px solid #000;border-bottom:1px solid #000}
table.bw-tab tr.dim td{opacity:.72}
.bw-net{display:flex;justify-content:space-between;align-items:center;border:2.5px solid #000;padding:10px 14px;margin:14px 0 14px}
.bw-net span{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;font-weight:800}
.bw-net b{font-size:20px;font-weight:800;letter-spacing:.5px}
.bw-foot{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.bw-mini{width:100%;border-collapse:collapse;font-size:10px}
.bw-mini th{text-align:left;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;border-bottom:1px solid #000;padding:4px 5px;font-weight:800}
.bw-mini td{padding:3px 5px;border-bottom:1px solid #bbb}
.bw-mini td:last-child{text-align:right;font-weight:700}
.bw-sg{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.bw-sg div b{display:block;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.bw-sg div i{display:block;border-bottom:1px solid #000;height:62px}
.bw-copy{border-top:1px solid #000;margin-top:14px;padding-top:7px;display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.4px}

@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff !important}
  body *{visibility:hidden}
  #paper,#paper *{visibility:visible}
  #paper{position:absolute;left:0;top:0;transform:none !important;width:720px;padding:0}
  .paper.bw{padding:4px 2px !important}
  .paper-wrap{overflow:visible;box-shadow:none;height:auto !important}
  /* le filigrane doit sortir à l'impression */
  .wm,.wm span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <svg class="flag" viewBox="0 0 60 40" role="img" aria-label="Drapeau de la Tunisie">
      <rect width="60" height="40" fill="#E70013"/>
      <circle cx="30" cy="20" r="12" fill="#fff"/>
      <circle cx="30" cy="20" r="9" fill="#E70013"/>
      <circle cx="32.2" cy="20" r="7.2" fill="#fff"/>
      <path fill="#E70013" d="M33.5,14 L34.85,18.15 L39.21,18.15 L35.68,20.71 L37.03,24.85 L33.5,22.29 L29.97,24.85 L31.32,20.71 L27.79,18.15 L32.15,18.15 Z"/>
    </svg>
    <div>
      <h1>Simulateur de paie</h1>
      <p>Tunisie · CNSS, IRPP, CSS · hors ligne</p>
    </div>
  </div>
</header>
<main id="app"></main>
<nav>
  <button id="tab-sim" class="on" data-tab="sim">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>Simulateur
  </button>
  <button id="tab-bul" data-tab="bul">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg>Bulletin
  </button>
  <button id="tab-par" data-tab="par">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Paramètres
  </button>
</nav>
<script src="calc.js"></script>
<script>
(function () {
  'use strict';
  var KEY_P = 'wp_params_v1', KEY_S = 'wp_state_v2';
  var MODE_LABELS = { net: 'Salaire net', gross: 'Salaire brut', cot: 'Salaire brut cotisable', base: 'Salaire de base' };
  var SHORT = { net: 'Net', gross: 'Brut', cot: 'Brut cotis.', base: 'Base' };
  var MODE_HINTS = {
    net: 'Le contrat indique le net d’un mois complet (avant avance, primes comprises). Le salaire de base est déduit.',
    gross: 'Le contrat indique le brut total d’un mois complet (base + primes). Le salaire de base est déduit.',
    cot: 'Le contrat indique base + primes cotisables (mois complet). Le salaire de base est déduit.',
    base: 'Vous saisissez directement le salaire de base mensuel.'
  };
  var MOIS = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCEMBRE'];
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var params = load(KEY_P);
  if (!params || !params.contracts || !params.fiscal || !params.bareme || !params.catalog) params = clone(WP.DEFAULT_PARAMS);

  var now = new Date();
  var BUL_DEF = { societe: '', adresseSoc: '', affil: '', annee: String(now.getFullYear()), mois: MOIS[now.getMonth()],
    matricule: '', cnssNo: '', emploi: '', categorie: '1', echelon: '1', regime: 'TEMPS PLEIN', template: 'bw', adresse: '', cin: '', dept: '',
    paiement: 'Virement', banque: '', compte: '', acquis: '2', solde: '0' };
  var state = load(KEY_S) || {};
  var bul = Object.assign({}, BUL_DEF, state.bul || {});
  state = Object.assign({ name: '', contract: 'CDI', mode: 'net', amount: '1800', chef: false, enfants: 0, prev: '26', trav: '', feries: '', conges: '',
    regime: 'mensuel', quotite: 1, hprev: '', htrav: '', hferies: '', hconges: '',
    avance: '', credit: '', penal: '', primes: [] }, state);
  state.bul = bul;
  if (!params.contracts[state.contract]) state.contract = Object.keys(params.contracts)[0];
  var uid = 0;
  state.primes.forEach(function (p) { p.id = ++uid; });
  var tab = 'sim';

  var nf = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  var fm = function (x) { return nf.format(x); };
  var pct = function (x) { return String(Math.round(x * 100000) / 1000).replace('.', ',') + ' %'; };
  var dj = function (x) { return String(Math.round(x * 100) / 100).replace('.', ','); };

  function catInfo(name) {
    var n = String(name || '').trim().toLowerCase();
    for (var i = 0; i < params.catalog.length; i++) if (params.catalog[i].name.trim().toLowerCase() === n) return params.catalog[i];
    return null;
  }
  var isH = function () { return state.regime === 'horaire'; };
  var qte = function () { return WP.normQuotite(state.quotite); };
  var hDef = function () { return WP.r3(WP.HOURS_FULL * qte()); };          // 208 h, 104 h en mi-temps
  var uLab = function (n) { return dj(n) + (isH() ? ' h' : ' j'); };
  function regimeLabel() {
    return (qte() === 1 ? 'TEMPS PLEIN' : 'MI-TEMPS') + (isH() ? ' · HORAIRE' : '');
  }
  function buildCtx() {
    return {
      params: params, contract: state.contract, chef: state.chef, enfants: state.enfants,
      avance: state.avance, credit: state.credit, penal: state.penal,
      regime: state.regime, quotite: qte(),
      hours: { prev: state.hprev === '' ? hDef() : state.hprev, trav: state.htrav, feries: state.hferies, conges: state.hconges },
      days: { prev: state.prev, trav: state.trav, feries: state.feries, conges: state.conges },
      primes: state.primes.filter(function (p) { return p.name; }).map(function (p) {
        var c = catInfo(p.name);
        return { name: p.name, cot: !!(c && c.cot), imp: !!(c && c.imp), mode: p.mode, value: p.mode === 'pct' ? WP.num(p.value) / 100 : WP.num(p.value) };
      })
    };
  }
  function calc() { return WP.solve(state.mode, state.amount, buildCtx()); }
  function persist() { save(KEY_S, state); }

  /* ================= SIMULATEUR ================= */
  function optionsHtml(list, sel) {
    return list.map(function (v) { return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  }
  // petites icônes de section (tracé simple, couleur héritée du titre)
  var ICONS = {
    contrat: '<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 12h7M9 16h5"/>',
    jours: '<rect x="3" y="5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v5M16 2v5"/>',
    heures: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    famille: '<circle cx="9" cy="8" r="3.4"/><path d="M2.5 21a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="10" r="2.6"/><path d="M15 21a5.6 5.6 0 0 1 6.5-5.4"/>',
    primes: '<path d="M12 3l2.6 5.6L21 9.4l-4.6 4.3 1.2 6.3L12 17l-5.6 3 1.2-6.3L3 9.4l6.4-.8z"/>',
    retenues: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
    periode: '<rect x="3" y="5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v5M16 2v5"/>',
    modele: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
    infos: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/>'
  };
  function ic(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }
  function pairsHtml(pairs, sel) {
    return pairs.map(function (p) { return '<option value="' + esc(p[0]) + '"' + (p[0] === sel ? ' selected' : '') + '>' + esc(p[1]) + '</option>'; }).join('');
  }
  function primeHtml(p) {
    var c = catInfo(p.name);
    var names = params.catalog.map(function (x) { return x.name; });
    if (p.name && !c) names.unshift(p.name);
    return '<div class="prime" data-pid="' + p.id + '">' +
      '<div class="top"><div><label>Prime</label><select data-f="name"><option value="">— choisir —</option>' + optionsHtml(names, p.name) + '</select></div>' +
      '<button class="del" data-act="delprime" aria-label="Supprimer">×</button></div>' +
      '<div class="row c2" style="margin-top:10px"><div><label>Type</label><select data-f="mode">' +
      '<option value="fixed"' + (p.mode === 'fixed' ? ' selected' : '') + '>Montant (DT)</option>' +
      '<option value="pct"' + (p.mode === 'pct' ? ' selected' : '') + '>% du base</option></select></div>' +

    var f = params.fiscal;
    var fisc = [['abattRate', 'Abattement frais pro. (%)', 'pct'], ['abattCap', 'Plafond abattement (DT/an)', 'num'], ['chef', 'Déduction chef de famille (DT/an)', 'num'],
      ['enfant', 'Déduction par enfant (DT/an)', 'num'], ['maxEnfants', 'Enfants déductibles (max)', 'num'], ['cssRate', 'Taux CSS (%)', 'pct'], ['cssSeuil', 'Seuil CSS (DT/an)', 'num']]
      .map(function (x) {
        return '<div class="row" style="margin-bottom:8px"><div><label>' + x[1] + '</label><input type="text" inputmode="decimal" data-p="fiscal.' + x[0] + '" data-kind="' + x[2] + '" value="' + (x[2] === 'pct' ? pc(f[x[0]]) : f[x[0]]) + '"></div></div>';
      }).join('');
    var bar = params.bareme.map(function (b, i) {
      return '<tr><td><input type="text" inputmode="decimal" data-p="bareme.' + i + '.from" data-kind="num" value="' + b.from + '"></td>' +
        '<td><input type="text" inputmode="decimal" data-p="bareme.' + i + '.rate" data-kind="pct" value="' + pc(b.rate) + '"></td>' +
        '<td><button class="del" data-act="delbar" data-i="' + i + '">×</button></td></tr>';
    }).join('');
    var cat = params.catalog.map(function (p, i) {
      return '<tr><td><input type="text" data-p="catalog.' + i + '.name" data-kind="text" value="' + esc(p.name) + '"></td>' +
        '<td><input type="checkbox" data-p="catalog.' + i + '.cot" data-kind="bool"' + (p.cot ? ' checked' : '') + ' style="width:22px;height:22px"></td>' +
        '<td><input type="checkbox" data-p="catalog.' + i + '.imp" data-kind="bool"' + (p.imp ? ' checked' : '') + ' style="width:22px;height:22px"></td>' +
        '<td><button class="del" data-act="delcat" data-i="' + i + '">×</button></td></tr>';
    }).join('');
    $('#app').innerHTML =
      '<div class="card"><h2>Contrats (taux en %)</h2><div style="overflow-x:auto"><table class="t" style="min-width:520px"><tr><th>Contrat</th><th>CNSS sal.</th><th>CNSS pat.</th><th>AT</th><th>TFP</th><th>FOPR.</th><th>IRPP</th><th>CSS</th></tr>' + rows + '</table></div>' +
      '<p class="hint">Hypothèses à valider : KARAMA (part patronale prise en charge par l’État) et SIVP (aucune retenue). AT, TFP et FOPROLOS dépendent du secteur.</p></div>' +
      '<div class="card"><h2>Paramètres fiscaux</h2>' + fisc + '</div>' +
      '<div class="card"><h2>Barème IRPP annuel</h2><table class="t"><tr><th>À partir de (DT)</th><th>Taux (%)</th><th></th></tr>' + bar + '</table>' +
      '<button class="btn" data-act="addbar" style="margin-top:8px">+ Ajouter une tranche</button>' +
      '<p class="hint">Barème de la loi de finances 2025. À vérifier si une loi de finances 2026 l’a modifié.</p></div>' +
      '<div class="card"><h2>Catalogue de primes</h2><table class="t"><tr><th>Prime</th><th>Cotis.</th><th>Impos.</th><th></th></tr>' + cat + '</table>' +
      '<button class="btn" data-act="addcat" style="margin-top:8px">+ Ajouter une prime au catalogue</button></div>' +
      '<div class="card"><button class="btn danger" data-act="reset" style="border-style:solid">Rétablir les paramètres par défaut</button></div>';
  }

  /* ================= ÉVÉNEMENTS ================= */
  function setPath(path, kind, el) {
    var parts = path.split('.'), o = params;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    var key = parts[parts.length - 1], v;
    if (kind === 'bool') v = el.checked;
    else if (kind === 'text') v = el.value;
    else if (kind === 'pct') v = WP.num(el.value) / 100;
    else v = WP.num(el.value);
    o[key] = v; save(KEY_P, params);
  }
  function toast(t) {
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1800);
  }
  function show(t) {
    tab = t;
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === t); });
    if (t === 'sim') renderSim(); else if (t === 'bul') renderBul(); else renderPar();
    window.scrollTo(0, 0);
  }
  var app = $('#app');
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.p) { setPath(t.dataset.p, t.dataset.kind, t); return; }
    if (t.dataset.b) { bul[t.dataset.b] = t.value; state.bul = bul; persist(); if (tab === 'bul') updatePaper(); return; }
    if (tab !== 'sim') return;
    var pe = t.closest('.prime');
    if (pe && t.dataset.f === 'value') {
      var p = state.primes.filter(function (x) { return String(x.id) === pe.dataset.pid; })[0];
      if (p) { p.value = t.value; persist(); updateResults(); }
    } else if (t.dataset.k && t.tagName === 'INPUT') {
      state[t.dataset.k] = t.value; persist(); updateResults();
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.p) { setPath(t.dataset.p, t.dataset.kind, t); return; }
    if (t.dataset.b) { bul[t.dataset.b] = t.value; state.bul = bul; persist(); if (tab === 'bul') updatePaper(); return; }
    if (tab !== 'sim') return;
    var pe = t.closest('.prime');
    if (pe && t.dataset.f) {
      var p = state.primes.filter(function (x) { return String(x.id) === pe.dataset.pid; })[0];
      if (!p) return;
      p[t.dataset.f] = t.value; persist();
      if (t.dataset.f === 'name' || t.dataset.f === 'mode') { $('#primes').innerHTML = state.primes.map(primeHtml).join(''); }
      updateResults();
    } else if (t.dataset.k) {
      var k = t.dataset.k;
      state[k] = k === 'enfants' ? parseInt(t.value, 10) : k === 'quotite' ? parseFloat(t.value) : t.value;
      persist();
      // changer de régime ou de quotité change les champs affichés (jours ↔ heures)
      if (k === 'regime' || k === 'quotite') renderSim(); else updateResults();
    }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'mode') { state.mode = b.dataset.v; persist(); renderSim(); }
    else if (act === 'chef') { state.chef = b.dataset.v === '1'; persist(); renderSim(); }
    else if (act === 'addprime') { state.primes.push({ id: ++uid, name: '', mode: 'fixed', value: '' }); persist(); $('#primes').innerHTML = state.primes.map(primeHtml).join(''); }
    else if (act === 'delprime') {
      var id = b.closest('.prime').dataset.pid; state.primes = state.primes.filter(function (x) { return String(x.id) !== id; });
      persist(); $('#primes').innerHTML = state.primes.map(primeHtml).join(''); updateResults();
    }
    else if (act === 'gobul') { show('bul'); }
    else if (act === 'print') { window.print(); }
    else if (act === 'share') {
      var txt = shareText();
      if (navigator.share) navigator.share({ title: 'Simulation de paie', text: txt }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Résultat copié'); });
    }
    else if (act === 'addbar') { params.bareme.push({ from: 0, rate: 0 }); save(KEY_P, params); renderPar(); }
    else if (act === 'delbar') { params.bareme.splice(+b.dataset.i, 1); save(KEY_P, params); renderPar(); }
    else if (act === 'addcat') { params.catalog.push({ name: 'Nouvelle prime', cot: false, imp: false }); save(KEY_P, params); renderPar(); }
    else if (act === 'delcat') { params.catalog.splice(+b.dataset.i, 1); save(KEY_P, params); renderPar(); }
    else if (act === 'reset') {
      if (confirm('Rétablir les paramètres par défaut ?')) { params = clone(WP.DEFAULT_PARAMS); save(KEY_P, params); if (!params.contracts[state.contract]) state.contract = 'CDI'; renderPar(); toast('Paramètres rétablis'); }
    }
  });
  document.querySelectorAll('nav button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });

  /* ================= INSTALLATION PWA ================= */
  var deferred = null;
  // iOS n'expose pas beforeinstallprompt : Safari n'a pas d'API d'installation,
  // l'ajout se fait à la main par Partager > Sur l'écran d'accueil.
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function isInstalled() {
    return navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; bindInstall(); });
  function bindInstall() {
    var btn = $('#installBtn'); if (!btn) return;
    if (isInstalled()) { btn.style.display = 'none'; return; }
    if (deferred) {
      btn.textContent = 'Installer l’application sur le téléphone';
      btn.classList.remove('note-ios');
      btn.style.display = 'block';
      btn.onclick = function () { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; btn.style.display = 'none'; }); };
      return;
    }
    if (isIOS) {
      btn.innerHTML = 'Installer sur iPhone : appuyez sur <b>Partager</b> ' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8.5 6.5 12 3l3.5 3.5"/>' +
        '<path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> puis <b>Sur l’écran d’accueil</b>';
      btn.classList.add('note-ios');
      btn.style.display = 'block';
      btn.onclick = null;
    }
  }
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

  renderSim();
})();
</script>
</body>
</html>
